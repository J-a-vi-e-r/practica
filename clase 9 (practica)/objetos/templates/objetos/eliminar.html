<!-- formulario para eliminar objeto -->
{% extends 'objetos/base.html' %}

{% block contenido %}
    <h1>Eliminar Objeto</h1>
    <p>¿Está seguro de que desea eliminar el objeto "{{ objeto.nombre }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'listar_objetos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
