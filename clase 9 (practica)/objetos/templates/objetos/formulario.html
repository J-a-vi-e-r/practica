{% extends 'objetos/base.html' %}
{% block titulo %}Formulario de Objeto{% endblock %}

{% block contenido %}
    <h2>{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="text-danger">
            {{ form.errors }}
        </div>
        <div class="form-group">
            <label for="id_nombre">Nombre:</label>
            {{ form.nombre }}
        </div>
        <div class="form-group">
            <label for="id_descripcion">Descripción:</label>
            {{ form.descripcion }}
        </div>
        <div class="form-group">
            <label for="id_entregado">Entregado:</label>
            {{ form.entregado }}
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'listar_objetos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
